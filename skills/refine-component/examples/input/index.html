<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Required field interaction example</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">FIELD / VALIDATION</p>
    <h1>Required email field</h1>
    <p class="intro">The error state explains recovery, moves focus to the field, and uses a brief shake as a secondary cue.</p>

    <form id="email-form" novalidate>
      <div class="field-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3.5" y="5.5" width="17" height="13" rx="2" />
          <path d="m4.5 7 7.5 6 7.5-6" />
        </svg>
      </div>
      <label for="email">Email address <span aria-hidden="true">*</span></label>
      <p class="hint" id="email-hint">Required. This example validates locally and does not send data.</p>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" aria-describedby="email-hint email-error" required>
      <p class="error" id="email-error"></p>
      <button type="submit">Check address
        <svg aria-hidden="true" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M8 3l5 5-5 5" /></svg>
      </button>
      <p class="status" id="status" role="status" aria-live="polite">Ready for input.</p>
    </form>
  </main>
</body>
</html>
